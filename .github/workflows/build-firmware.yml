name: Build WatchOS Firmware & OTA Release

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release?'
        required: true
        type: boolean
        default: true
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Firmware (PlatformIO)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile WatchOS Firmware & Generate Release Artifacts
        run: |
          chmod +x scripts/build_ci.sh
          ./scripts/build_ci.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchos-firmware
          path: build_output/

      - name: Update 'latest' Release
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name != 'workflow_dispatch' || inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "WatchOS Automated Build (Latest)"
          body: |
            Automated CI/CD build from commit `${{ github.sha }}`.
            
            - **Target:** LilyGO T-Watch S3 (ESP32-S3, 16MB Flash, 8MB PSRAM)
            - **Date:** ${{ github.event.head_commit.timestamp || github.event.release.published_at }}
            - **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            
            ### Assets:
            - `firmware.bin` (Download and flash via WatchOS OTA Web Interface)
            - `firmware.bin.sha256` (Integrity checksum)
            - `version.json` (Metadata)
          draft: false
          prerelease: false
          files: |
            build_output/firmware.bin
            build_output/WatchOS-firmware.bin
            build_output/firmware.bin.sha256
            build_output/WatchOS-firmware.bin.sha256
            build_output/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

