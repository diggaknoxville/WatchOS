; PlatformIO Project Configuration für LilyGo T-Watch S3 (WatchOS)
[platformio]
default_envs = twatch-s3
src_dir = .

[env:twatch-s3]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

build_src_filter =
    +<*.cpp>
    +<*.ino>
    -<build/**>
    -<build_output/**>

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv

; QIO/DIO Flash + OPI PSRAM Konfiguration für T-Watch S3 (8MB PSRAM)
board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT=1
    -DARDUINO_T_WATCH_S3=1
    ; TFT_eSPI Konfiguration für ST7789 240x240 Display
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=12
    -DTFT_DC=38
    -DTFT_RST=-1
    -DTOUCH_CS=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lewisxhe/XPowersLib @ ^0.3.3
    lewisxhe/SensorLib @ ^0.4.1
    jgromes/RadioLib @ ^6.6.0

upload_speed = 921600
monitor_speed = 115200

